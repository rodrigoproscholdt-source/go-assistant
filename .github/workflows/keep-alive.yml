# .github/workflows/keep-alive.yml
# Mantem o Streamlit Cloud acordado + roda testes a cada push
# Gratuito: GitHub Actions da 2000 min/mes gratis; este workflow usa ~2 min/dia

name: Keep Alive & Test

on:
  schedule:
    # A cada 6 horas (0, 6, 12, 18) — evita o app dormir no free tier
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:  # permite rodar manual

jobs:
  health-check:
    name: Health Check + Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (retrieval only, sem Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -X utf8 smoke_test.py

      - name: Ping health endpoint (se deployado)
        if: env.STREAMLIT_URL != ''
        run: |
          curl -fsS "https://${{ env.STREAMLIT_URL }}/?healthz=1" | jq .
        env:
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}

      - name: Log result
        run: echo "✅ Health check OK $(date -u)"

  test-suite:
    name: Suite 300 casos (retrieval)
    if: github.event_name == 'push'  # so roda em push, nao no cron
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar suite 300 (retrieval only)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -X utf8 test_suite_300.py --k 5 --limiar 0.80

      - name: Upload failure report (se houver)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: /tmp/failures.json
          retention-days: 7